{% extends "base.html" %}

{% block title %}Quiz{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto p-8">

    <a href="javascript:history.back()"
       class="text-indigo-600 font-semibold">
        ← Back
    </a>

    <div class="bg-white shadow-lg rounded-xl p-8 mt-6">

        <h1 class="text-4xl font-bold mb-8">
            Quiz
        </h1>

        <div id="quizContainer">
        </div>

        <button
            onclick="submitQuiz()"
            class="mt-8 bg-indigo-600 text-white px-6 py-3 rounded-lg">

            Submit Quiz

        </button>

    </div>

</div>

<script>

const quizId = {{ quiz_id }};

async function loadQuiz(){

    const res =
        await fetch(`/api/quiz/${quizId}`);

    const data = await res.json();

    const container =
        document.getElementById('quizContainer');

    container.innerHTML = `
        <h2 class="text-2xl font-bold mb-4">
            ${data.quiz.question}
        </h2>

        <div class="space-y-3">

            <label class="block">
                <input type="radio"
                       name="answer"
                       value="A">
                ${data.quiz.option_a}
            </label>

            <label class="block">
                <input type="radio"
                       name="answer"
                       value="B">
                ${data.quiz.option_b}
            </label>

            <label class="block">
                <input type="radio"
                       name="answer"
                       value="C">
                ${data.quiz.option_c}
            </label>

            <label class="block">
                <input type="radio"
                       name="answer"
                       value="D">
                ${data.quiz.option_d}
            </label>

        </div>
    `;
}

async function submitQuiz(){

    const selected =
        document.querySelector(
            'input[name="answer"]:checked'
        );

    if(!selected){
        alert("Select an answer");
        return;
    }

    const res = await fetch(
        `/api/quiz/${quizId}/submit`,
        {
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify({
                answer:selected.value
            })
        }
    );

    const data = await res.json();

    alert(
        `Score: ${data.score}% | XP Earned: ${data.xp}`
    );

    window.location.href='/dashboard';
}

loadQuiz();

</script>

{% endblock %}
