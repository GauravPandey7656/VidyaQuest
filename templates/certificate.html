<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificate</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.certificate{
    width:1000px;
    margin:40px auto;
    background:white;
    padding:60px;
    border:12px solid #4f46e5;
    text-align:center;
}

.title{
    font-size:50px;
    color:#4f46e5;
    font-weight:bold;
}

.subtitle{
    font-size:22px;
    margin-top:20px;
}

.name{
    font-size:42px;
    margin:30px 0;
    color:#111827;
    font-weight:bold;
}

.course{
    font-size:28px;
    margin-top:20px;
}

.footer{
    margin-top:60px;
    display:flex;
    justify-content:space-between;
}

</style>

</head>
<body>

<div class="certificate">

<div style="font-size:70px;margin-bottom:10px;">
🏆
</div>

<div class="title">
Certificate of Completion
</div>

<div style="
font-size:18px;
letter-spacing:3px;
color:#6b7280;
margin-top:10px;">
VIDYAQUEST LEARNING PLATFORM
</div>

<div class="subtitle">
This certificate is proudly presented to
</div>

<div class="name">
{{ name }}
</div>

<div style="
width:350px;
height:2px;
background:#4f46e5;
margin:10px auto 0 auto;">
</div>

<div class="course">
Successfully completed
<br><br>
<b>Gamified Learning Program</b>
<br><br>
with outstanding dedication and performance.
</div>

<div style="margin-top:40px;">
Date: {{ date }}
</div>
<div style="margin-top:40px;font-size:60px;">
⭐ ⭐ ⭐ ⭐ ⭐
</div>
<div class="footer">

<div>
_________________
<br>
Instructor
</div>

<div>
_________________
<br>
VidyaQuest
</div>

</div>

</div>

</body>
</html>
